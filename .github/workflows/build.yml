name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # manifest.json uses {major}.{minor}.{patch}.{build}; tags and
          # CHANGELOG.md use {major}.{minor}.{patch}.
          manifest_version=$(plutil -extract Version raw -o - Sources/com.gabrielperales.osascript.sdPlugin/manifest.json)
          release_version=${manifest_version%.*}
          if [ "v$release_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json Version is $manifest_version (release $release_version) but tag is $GITHUB_REF_NAME"
            exit 1
          fi
          awk -v v="$release_version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > build-release-notes.md
          if ! grep -q '[^[:space:]]' build-release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$release_version]"
            exit 1
          fi

      - name: Build
        run: make build

      - name: Stage plugin
        run: make stage

      - name: Validate
        run: make validate

      - name: Pack
        run: make pack

      - uses: actions/upload-artifact@v7
        with:
          name: com.gabrielperales.osascript.streamDeckPlugin
          path: build/release/com.gabrielperales.osascript.streamDeckPlugin

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/com.gabrielperales.osascript.streamDeckPlugin \
            --title "$GITHUB_REF_NAME" --notes-file build-release-notes.md
