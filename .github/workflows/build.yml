name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(plutil -extract Version raw -o - Sources/com.gabrielperales.osascript.sdPlugin/manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json Version is $manifest_version but tag is $GITHUB_REF_NAME"
            exit 1
          fi
          awk -v v="$manifest_version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > build-release-notes.md
          if ! grep -q '[^[:space:]]' build-release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$manifest_version]"
            exit 1
          fi

      - name: Build, validate and package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: com.gabrielperales.osascript.streamDeckPlugin
          path: build/release/com.gabrielperales.osascript.streamDeckPlugin

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/com.gabrielperales.osascript.streamDeckPlugin \
            --title "$GITHUB_REF_NAME" --notes-file build-release-notes.md
