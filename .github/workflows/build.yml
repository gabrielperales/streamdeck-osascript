name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Decide whether to release
        id: release
        run: |
          # manifest.json uses {major}.{minor}.{patch}.{build}; tags and
          # CHANGELOG.md use {major}.{minor}.{patch}.
          manifest_version=$(plutil -extract Version raw -o - Sources/com.gabrielperales.osascript.sdPlugin/manifest.json)
          manifest_release=${manifest_version%.*}
          case "$GITHUB_REF" in
            refs/tags/v*)
              # A tag pushed by hand: release that version.
              release_version=${GITHUB_REF_NAME#v}
              ;;
            refs/heads/master)
              # A push to master: release the newest CHANGELOG.md version
              # if it has no tag yet.
              release_version=$(sed -n 's/^## \[\([0-9][0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
              if [ -z "$release_version" ]; then
                echo "No released version in CHANGELOG.md; nothing to release."
                exit 0
              fi
              if [ -n "$(git ls-remote --tags origin "refs/tags/v$release_version")" ]; then
                echo "v$release_version is already tagged; nothing to release."
                exit 0
              fi
              ;;
            *)
              exit 0
              ;;
          esac
          if [ "$manifest_release" != "$release_version" ]; then
            echo "::error::manifest.json Version is $manifest_version (release $manifest_release) but the release is v$release_version"
            exit 1
          fi
          awk -v v="$release_version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > build-release-notes.md
          if ! grep -q '[^[:space:]]' build-release-notes.md; then
            echo "::error::CHANGELOG.md has no section for [$release_version]"
            exit 1
          fi
          echo "Releasing v$release_version."
          echo "tag=v$release_version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make build

      - name: Stage plugin
        run: make stage

      - name: Validate
        run: make validate

      - name: Pack
        run: make pack

      - name: End-to-end test (fake Stream Deck)
        run: make e2e

      - uses: actions/upload-artifact@v7
        with:
          name: com.gabrielperales.osascript.streamDeckPlugin
          path: build/release/com.gabrielperales.osascript.streamDeckPlugin

      - name: Publish GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # On master the tag does not exist yet. A tag pushed with
          # GITHUB_TOKEN does not start another workflow run, so this run
          # publishes the package it has just built and tested.
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${TAG#v}" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            build/release/com.gabrielperales.osascript.streamDeckPlugin \
            --verify-tag --title "$TAG" --notes-file build-release-notes.md
