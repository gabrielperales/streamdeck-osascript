name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: make test

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(plutil -extract Version raw -o - Sources/com.gabrielperales.osascript.sdPlugin/manifest.json)
          if [ "v$manifest_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json Version is $manifest_version but tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build and package
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: com.gabrielperales.osascript.streamDeckPlugin
          path: build/release/com.gabrielperales.osascript.streamDeckPlugin

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/com.gabrielperales.osascript.streamDeckPlugin \
            --title "$GITHUB_REF_NAME" --generate-notes
